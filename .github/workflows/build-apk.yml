name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            patch build-essential lld libltdl-dev libtool-bin gettext ccache

      - name: Cache Buildozer & Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a_patches/build.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer & Python tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer cython pillow
          python -m py_compile main.py p4a_hook.py

      - name: Configure Gradle properties
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          if [ -f p4a_patches/gradle.properties ]; then
            cp -a p4a_patches/gradle.properties "$HOME/.gradle/gradle.properties"
          else
            printf "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.daemon=false\n" > "$HOME/.gradle/gradle.properties"
          fi
          cat << 'EOF' > "$HOME/.gradle/init.d/maven-mirror.gradle"
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  google()
                  maven { url = "https://maven-central.storage-download.googleapis.com/maven2" }
              }
              project.repositories {
                  google()
                  maven { url = "https://maven-central.storage-download.googleapis.com/maven2" }
              }
          }
          EOF

      - name: Restore persistent Android debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64_ZALMAN_VM }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
            if [ -n "${XDG_CONFIG_HOME:-}" ]; then
              mkdir -p "$XDG_CONFIG_HOME/.android"
              cp -a "$HOME/.android/debug.keystore" "$XDG_CONFIG_HOME/.android/debug.keystore"
            fi
            echo "Restored persistent debug.keystore:"
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          else
            echo "WARNING: ANDROID_DEBUG_KEYSTORE_B64_ZALMAN_VM secret is not set; Gradle will generate an ephemeral debug.keystore."
          fi

      - name: Sync version in buildozer.spec with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "Setting buildozer.spec version to ${TAG_VER}"
          sed -i "s/^version = .*/version = ${TAG_VER}/" buildozer.spec
          grep '^version =' buildozer.spec

      - name: Update p4a and apply local patches
        run: |
          yes | buildozer android update || true
          P4A_TARGET=".buildozer/android/platform/python-for-android/pythonforandroid/build.py"
          if [ -f p4a_patches/build.py ] && [ -f "$P4A_TARGET" ]; then
            cp -a p4a_patches/build.py "$P4A_TARGET"
            echo "Applied p4a_patches/build.py"
          fi

      - name: Build Android APK
        run: |
          sed -i 's/^#\?[[:space:]]*android\.accept_sdk_license[[:space:]]*=.*/android.accept_sdk_license = True/' buildozer.spec
          rm -rf .buildozer/android/platform/build-*/build/venv
          buildozer -v android debug
          ls -lh bin/*.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$HOME/.buildozer/android/platform/android-sdk/build-tools" -name apksigner | sort -V | tail -n 1)
          APK=$(ls bin/*.apk | head -n 1)
          echo "Verifying signature of $APK using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer|SHA-256"
          if [ -f "$HOME/.android/debug.keystore" ]; then
            EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ {gsub(/:/,"",$2); print tolower($2); exit}')
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print tolower($NF); exit}')
            echo "Expected SHA-256: $EXPECTED"
            echo "Actual   SHA-256: $ACTUAL"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "ERROR: APK signature does not match restored debug.keystore!"
              exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: enigma2tv-apk-${{ github.ref_name }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" bin/*.apk --clobber
          else
            gh release create "${{ github.ref_name }}" bin/*.apk \
              --title "Enigma2 TV ${{ github.ref_name }}" \
              --generate-notes
          fi
